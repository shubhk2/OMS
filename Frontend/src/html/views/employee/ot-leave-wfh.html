  <link rel="shortcut icon" type="image/png" href="../../../assets/images/logos/favicon.png" />

    data-sidebar-position="fixed" data-header-position="fixed">
    <!-- Sidebar Start -->

            <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
              <i class="ti ti-x fs-8"></i>
            </div>
        </div>
        <!-- Sidebar navigation-->
        <nav class="sidebar-nav">
          <ul id="sidebarnav" class="mb-4 pb-2">
            <li class="nav-small-cap">
              <i class="ti ti-dots nav-small-cap-icon fs-5"></i>
              <span class="hide-menu">Home</span>
            </li>
            <li class="sidebar-item">
              <a
                class="sidebar-link sidebar-link primary-hover-bg"
                href="./index.html"
                aria-expanded="false"
              >
                <span class="aside-icon p-2 bg-light-primary rounded-3">
                  <i class="ti ti-layout-dashboard fs-7 text-primary"></i>
                </span>
                <span class="hide-menu ms-2 ps-1">Dashboard</span>
              </a>
            </li>
            <li class="nav-small-cap">
              <i class="ti ti-dots nav-small-cap-icon fs-5"></i>
              <span class="hide-menu">Options</span>
            </li>
            <li class="sidebar-item">
              <a
                class="sidebar-link sidebar-link warning-hover-bg"
                href="./tasks.html"
                aria-expanded="false"
              >
                <span class="aside-icon p-2 bg-light-warning rounded-3">
                  <i class="ti ti-article fs-7 text-warning"></i>
                </span>
                <span class="hide-menu ms-2 ps-1">Your Task</span>
              </a>
            </li>
            <li class="sidebar-item">
              <a
                class="sidebar-link sidebar-link danger-hover-bg"
                href="./projects.html"
                aria-expanded="false"
              >
                <span class="aside-icon p-2 bg-light-danger rounded-3">
                  <i class="ti ti-alert-circle fs-7 text-danger"></i>
                </span>
                <span class="hide-menu ms-2 ps-1">Projects</span>
              </a>
            </li>
            <li class="sidebar-item">
              <a
                class="sidebar-link sidebar-link success-hover-bg"
                href="./ot-leave-wfh.html"
                aria-expanded="false"
              >
                <span class="aside-icon p-2 bg-light-success rounded-3">
                  <i class="ti ti-cards fs-7 text-success"></i>
                </span>

              </a>
            </li>
            <li class="sidebar-item">
              <a
                class="sidebar-link sidebar-link primary-hover-bg"
                href="./attendance.html"
                aria-expanded="false"
              >
                <span class="aside-icon p-2 bg-light-primary rounded-3">
                  <i class="ti ti-file-description fs-7 text-primary"></i>
                </span>
                <span class="hide-menu ms-2 ps-1">Attendance</span>
              </a>
            </li>
            <li class="sidebar-item">
              <a
                class="sidebar-link sidebar-link indigo-hover-bg"
                href="./salary.html"
                aria-expanded="false"
              >
                <span class="aside-icon p-2 bg-light-indigo rounded-3">
                  <i class="ti ti-typography fs-7 text-indigo"></i>
                </span>
                <span class="hide-menu ms-2 ps-1">Salary</span>
              </a>
            </li>

          </ul>



        </nav>
        <!-- End Sidebar navigation -->
      </div>
      <!-- End Sidebar scroll-->
    </aside>
    <!--  Sidebar End -->
    <!--  Main wrapper -->
    <div class="body-wrapper">
      <!--  Header Start -->
      <header class="app-header">
        <nav class="navbar navbar-expand-lg navbar-light">
          <ul class="navbar-nav">
            <li class="nav-item d-block d-xl-none">
              <a class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse" href="javascript:void(0)">
                <i class="ti ti-menu-2"></i>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-icon-hover" href="javascript:void(0)">
                <i class="ti ti-bell-ringing"></i>
                <div class="notification bg-primary rounded-circle"></div>
              </a>
            </li>
          </ul>
          <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
            <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">

              <li class="nav-item dropdown">
                <a class="nav-link nav-icon-hover" href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  <img src="../../../assets/images/profile/user1.jpg" alt="" width="35" height="35" class="rounded-circle">
                </a>
                <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                  <div class="message-body">
                    <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                      <i class="ti ti-user fs-6"></i>
                      <p class="mb-0 fs-3">My Profile</p>
                    </a>
                    <a href="javascript:void(0)" id="logoutBtn" class="btn btn-outline-primary mx-3 mt-2 d-block">Logout</a>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </nav>
      </header>
      <!--  Header End -->
      <div class="container-fluid">
        <!-- Add month selector row -->
        <div class="row mb-3">
          <div class="col-12 d-flex justify-content-between align-items-center">
            <div>
              <button class="btn btn-outline-secondary btn-sm" id="month-prev">&laquo;</button>
              <span id="month-label" class="mx-2 fw-semibold"></span>
              <button class="btn btn-outline-secondary btn-sm" id="month-next">&raquo;</button>
            </div>
          </div>
        </div>

        <!-- Top Row: 3 Cards -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <span>Leaves</span>
                        <span class="badge bg-light text-dark" id="leave-count">0</span>
                    </div>
                    <div class="card-body">
                        <div id="leave-calendar" class="calendar-grid">
                            <!-- Calendar boxes will be injected here by JS -->
                            <p class="text-muted text-center">Select month to view history</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <span>Overtime</span>
                        <span class="badge bg-light text-dark" id="ot-count">0</span>
                    </div>
                    <div class="card-body">
                        <div id="ot-calendar" class="calendar-grid">
                            <!-- Calendar boxes will be injected here by JS -->
                            <p class="text-muted text-center">Select month to view history</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <span>Work From Home</span>
                        <span class="badge bg-light text-dark" id="wfh-count">0</span>
                    </div>
                    <div class="card-body">
                        <div id="wfh-calendar" class="calendar-grid">
                            <!-- Calendar boxes will be injected here by JS -->
                            <p class="text-muted text-center">Select month to view history</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="row mb-3">
            <div class="col-12 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#requestModal">
                    <i class="bi bi-plus-circle"></i> New Request
                </button>
            </div>
        </div>

        <!-- Request Modal -->
        <div class="modal fade" id="requestModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">New Request</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="requestForm">
                            <div class="mb-3">
                                <label class="form-label">Amenity Type</label>
                                <select class="form-select" id="amenityType" required onchange="toggleFormFields()">
                                    <option value="" selected disabled>Select Type...</option>
                                    <option value="leave">Leave</option>
                                    <option value="ot">Overtime</option>
                                    <option value="wfh">Work From Home</option>
                                </select>
                            </div>

                            <!-- Dynamic Fields -->
                            <div id="leaveFields" class="d-none">
                                <div class="mb-3">
                                    <label class="form-label">Leave Type</label>
                                    <select class="form-select" name="leave_type_id" id="leaveTypeId">
                                        <!-- Populate from backend -->
                                        <option value="1">Sick Leave</option>
                                        <option value="2">Casual Leave</option>
                                    </select>
                                </div>
                            </div>

                            <div id="otFields" class="d-none">
                                <div class="mb-3">
                                    <label class="form-label">Requested Minutes</label>
                                    <input type="number" class="form-control" name="requested_minutes" id="requestedMinutes">
                                </div>
                            </div>

                            <!-- Common Date Fields -->
                            <div class="mb-3">
                                <label class="form-label">From Date / Date</label>
                                <input type="date" class="form-control" name="from_date" id="fromDate" required>
                            </div>

                            <div class="mb-3" id="toDateGroup">
                                <label class="form-label">To Date</label>
                                <input type="date" class="form-control" name="to_date" id="toDate">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Reason / Description</label>
                                <textarea class="form-control" name="reason" id="reason" rows="3" required></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" onclick="submitRequest()">Submit Request</button>
                    </div>
                </div>
            </div>
        </div>
      </div>

    <!-- calendar styles -->
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 0.8rem;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .cal-approved { background-color: #0d6efd; color: white; }
        .cal-declined { background-color: #dc3545; color: white; }
        .cal-pending { background-color: #fd7e14; color: white; }
    </style>

    </div>
  </div>
  <script src="../../../assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="../../../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../assets/js/sidebarmenu.js"></script>
  <script src="../../../assets/js/app.min.js"></script>
  <script src="../../../assets/libs/simplebar/dist/simplebar.js"></script>
  <script src="../../../assets/js/auth.js"></script>
  <script src="../../../assets/js/requests.js"></script>
</body>

</html>
